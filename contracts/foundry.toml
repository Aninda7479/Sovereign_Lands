[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 2

# Test and timeout settings
test_timeout = 300
gas_reports = ["SovereignLands", "MockSovereignLands"]
ffi = false

# File system permissions
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read", path = "../" }
]

[rpc_endpoints]
amoy = "${POLYGON_AMOY_RPC_URL}"
polygon_amoy = "https://rpc-amoy.polygon.technology"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_sepolia_public = "https://sepolia.base.org"
localhost = "http://127.0.0.1:8545"

[etherscan]
amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
polygon_amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
